name: Test categorized setting dossiers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify approved records and classification decisions
        run: |
          python scripts/source_store.py verify
          python scripts/candidate_store.py verify
          python scripts/decision_store.py verify
          python scripts/relationship_workflow.py verify
          python scripts/setting_classification.py verify
      - name: Run full test suite
        run: python -m unittest discover -s tests -v
      - name: Show setting counts by category
        run: python scripts/setting_dossier.py --summary
      - name: Show unclassified settings
        run: python scripts/setting_dossier.py --category unclassified

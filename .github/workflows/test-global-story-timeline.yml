name: Test global story timeline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify global timeline
        run: python scripts/story_timeline.py verify
      - name: Run all tests
        run: python -m unittest discover -s tests -v
      - name: Check timeline integration
        run: |
          python scripts/character_relationship_timeline.py --use-approved-order --summary
          python scripts/story_timeline.py list --status approved

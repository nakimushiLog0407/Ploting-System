name: Test plot cards

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify plot cards
        run: python scripts/plot_cards.py verify
      - name: Verify plot overview
        run: python scripts/plot_cards.py list
      - name: Run full test suite
        run: python -m unittest discover -s tests -v

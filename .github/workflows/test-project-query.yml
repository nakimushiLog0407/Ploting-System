name: Test project query

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify dashboard query
        run: python scripts/project_query.py dashboard
      - name: Verify inbox query
        run: python scripts/project_query.py inbox
      - name: Verify progress query
        run: python scripts/project_query.py progress
      - name: Verify manuscript query
        run: python scripts/project_query.py manuscript
      - name: Run full test suite
        run: python -m unittest discover -s tests -v

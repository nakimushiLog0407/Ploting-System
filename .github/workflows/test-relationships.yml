name: Test candidate relationships

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-relationships:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source and candidate archives
        run: |
          python scripts/source_store.py verify
          python scripts/candidate_store.py verify
          python scripts/decision_store.py verify
      - name: Verify relationship records
        run: python scripts/relationship_catalog.py --verify
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Show approved links
        run: python scripts/relationship_catalog.py --status approved

name: Test writing progress

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify writing progress
        run: python scripts/writing_progress.py --summary
      - name: Display chapter and scene progress
        run: python scripts/writing_progress.py
      - name: Run full test suite
        run: python -m unittest discover -s tests -v

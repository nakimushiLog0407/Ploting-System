name: Test manuscript export

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify manuscript assembly
        run: python scripts/manuscript_export.py --format json
      - name: Verify text export
        run: python scripts/manuscript_export.py --format text
      - name: Run full test suite
        run: python -m unittest discover -s tests -v

name: Test canon diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source canon
        run: python scripts/canon_catalog.py --summary
      - name: Verify chronology and relationships
        run: |
          python scripts/story_timeline.py verify
          python scripts/event_placement.py verify
          python scripts/event_order.py verify
          python scripts/character_relation_types.py verify
      - name: Run full test suite
        run: python -m unittest discover -s tests -v
      - name: Summarize diagnostics
        run: python scripts/canon_diagnostics.py --summary

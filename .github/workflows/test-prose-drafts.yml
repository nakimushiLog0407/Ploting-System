name: Test prose drafts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify prose draft records
        run: python scripts/prose_drafts.py verify
      - name: Display draft approval status
        run: python scripts/prose_drafts.py list
      - name: Run full test suite
        run: python -m unittest discover -s tests -v

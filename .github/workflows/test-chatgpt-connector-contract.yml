name: Test ChatGPT connector contract

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify connector contract
        run: python scripts/verify_chatgpt_connector.py
      - name: Run full test suite
        run: python -m unittest discover -s tests -v

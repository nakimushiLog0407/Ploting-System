name: Test foreshadowing changes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify foreshadowing records
        run: python scripts/foreshadowing.py verify
      - name: Verify approved assignment changes
        run: python scripts/foreshadowing_changes.py verify
      - name: Show effective foreshadowing
        run: python scripts/foreshadowing_changes.py list
      - name: Run full test suite
        run: python -m unittest discover -s tests -v

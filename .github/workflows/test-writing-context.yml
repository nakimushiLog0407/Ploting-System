name: Test writing context

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify writing context module
        run: python -m py_compile scripts/writing_context.py
      - name: Run full test suite
        run: python -m unittest discover -s tests -v

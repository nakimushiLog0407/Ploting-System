name: Test candidate review view

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify candidate and decision integrity
        run: python scripts/decision_store.py verify
      - name: Verify read-only candidate view
        run: python scripts/candidate_review_view.py --status all
      - name: Run full test suite
        run: python -m unittest discover -s tests -v

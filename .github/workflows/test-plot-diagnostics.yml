name: Test plot diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify plot diagnostics
        run: python scripts/plot_diagnostics.py --summary
      - name: Show review findings
        run: python scripts/plot_diagnostics.py
      - name: Run full test suite
        run: python -m unittest discover -s tests -v

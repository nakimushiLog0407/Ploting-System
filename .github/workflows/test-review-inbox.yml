name: Test review inbox

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify unified review inbox
        run: python scripts/review_inbox.py --summary
      - name: Display pending review items
        run: python scripts/review_inbox.py
      - name: Run full test suite
        run: python -m unittest discover -s tests -v

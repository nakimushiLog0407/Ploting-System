name: Test event placement

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify global story timeline
        run: python scripts/story_timeline.py verify
      - name: Verify event placement records
        run: python scripts/event_placement.py verify
      - name: Run full test suite
        run: python -m unittest discover -s tests -v
      - name: Show event placement summary
        run: python scripts/event_placement.py timeline --summary

name: Test plot diagnostic reviews

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify diagnostic reviews
        run: python scripts/plot_diagnostic_review.py verify
      - name: Display reviewed findings
        run: python scripts/plot_diagnostic_review.py list
      - name: Run full test suite
        run: python -m unittest discover -s tests -v

name: Test approved canon catalog

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source, candidates, and decisions
        run: |
          python scripts/source_store.py verify
          python scripts/candidate_store.py verify
          python scripts/decision_store.py verify
      - name: Test catalog
        run: python -m unittest discover -s tests -v
      - name: Display approved entries
        run: |
          python scripts/canon_catalog.py --summary
          python scripts/canon_catalog.py --kind dialogue
          python scripts/canon_catalog.py --query '改行と空白'

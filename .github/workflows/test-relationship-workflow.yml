name: Test relationship proposal and review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify archives and relationship reviews
        run: |
          python scripts/source_store.py verify
          python scripts/decision_store.py verify
          python scripts/relationship_workflow.py verify
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Show approved relationships
        run: python scripts/relationship_workflow.py list --status approved

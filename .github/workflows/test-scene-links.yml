name: Test scene links

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify scene links
        run: python scripts/scene_links.py verify
      - name: Display scene relationships
        run: python scripts/scene_links.py list
      - name: Run full test suite
        run: python -m unittest discover -s tests -v

name: Test unified ChatGPT read

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read project summary in Japanese
        run: python scripts/chat_read.py "制作状況"
      - name: Read approved canon in Japanese
        run: python scripts/chat_read.py "正式設定" --limit 10
      - name: Reject unsupported write-like command
        run: |
          if python scripts/chat_read.py "設定を承認"; then
            echo "Unexpected write-like command accepted"
            exit 1
          fi
      - name: Run full test suite
        run: python -m unittest discover -s tests -v

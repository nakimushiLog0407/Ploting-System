name: Test integrated plot overview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify integrated plot overview
        run: python scripts/plot_overview.py --summary
      - name: Display full plot overview
        run: python scripts/plot_overview.py
      - name: Run full test suite
        run: python -m unittest discover -s tests -v

name: Test character relation types

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify character relations
        run: python scripts/character_relation_types.py verify
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Show approved typed relations
        run: python scripts/character_relation_types.py list --status approved

name: Test Japanese canon lookup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify approved character settings
        run: python scripts/chat_canon_japanese.py "人物設定"
      - name: Verify approved world settings
        run: python scripts/chat_canon_japanese.py "世界設定"
      - name: Run full test suite
        run: python -m unittest discover -s tests -v

name: Test prose revisions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify prose revisions
        run: python scripts/prose_revisions.py verify
      - name: Show effective prose
        run: python scripts/prose_revisions.py list
      - name: Run full test suite
        run: python -m unittest discover -s tests -v

name: Test character relationship graph

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify approved relationships
        run: python scripts/relationship_workflow.py verify
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Show graph summary
        run: python scripts/character_relationship_graph.py --summary

name: Test setting classifications

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify classification archive
        run: python scripts/setting_classification.py verify
      - name: Run all tests
        run: python -m unittest discover -s tests -v
      - name: List approved classifications
        run: python scripts/setting_classification.py list --status approved

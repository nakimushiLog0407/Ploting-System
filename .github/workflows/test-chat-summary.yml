name: Test chat summaries

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify bounded dashboard
        run: python scripts/chat_summary.py "制作状況"
      - name: Verify bounded review inbox
        run: python scripts/chat_summary.py "確認待ち" --limit 10
      - name: Verify bounded writing progress
        run: python scripts/chat_summary.py "執筆進捗" --limit 10
      - name: Run full test suite
        run: python -m unittest discover -s tests -v

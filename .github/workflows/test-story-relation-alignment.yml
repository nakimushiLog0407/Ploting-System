name: Test story relation alignment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify global phases
        run: python scripts/story_timeline.py verify
      - name: Verify event placement and order
        run: |
          python scripts/event_placement.py verify
          python scripts/event_order.py verify
      - name: Verify character relations
        run: python scripts/character_relation_types.py verify
      - name: Run all tests
        run: python -m unittest discover -s tests -v
      - name: Summarize aligned view
        run: python scripts/story_relation_alignment.py --summary
